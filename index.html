<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Seguimiento de Pago Wilfer</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1a73e8">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="icon.svg">
<style>
:root {
--primary:#1a73e8; --primary-dark:#1557b0;
--success:#16a34a; --success-bg:#e7f6ec;
--danger:#dc2626; --danger-bg:#fdecec;
--warning:#d97706; --warning-bg:#fff4e5;
--info:#6b7280; --info-bg:#f0f1f3;
--bg:#eef1f6; --card:#ffffff; --radius:16px;
--shadow: 0 2px 6px rgba(20,20,43,.06), 0 8px 24px rgba(20,20,43,.06);
--shadow-hover: 0 6px 14px rgba(20,20,43,.10), 0 14px 32px rgba(20,20,43,.10);
}
* { box-sizing: border-box; }
body {
font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
margin:0; background:var(--bg); color:#1c1c1e; padding-bottom:48px;
}
header {
background: linear-gradient(135deg, var(--primary), var(--primary-dark));
color:white; padding:22px 16px 26px; text-align:center;
border-radius: 0 0 24px 24px; box-shadow: var(--shadow);
}
header h1 { margin:0; font-size:19px; letter-spacing:.2px; }
header p { margin:4px 0 0; font-size:12.5px; opacity:.85; }

.wrap { max-width:640px; margin:0 auto; padding: 0 12px; }

.card {
background:var(--card); border-radius:var(--radius); margin:14px 0; padding:16px;
box-shadow: var(--shadow); transition: box-shadow .25s ease, transform .25s ease;
}
.card:hover { box-shadow: var(--shadow-hover); transform: translateY(-2px); }
.card h2 { margin:0 0 12px; font-size:14.5px; color:#1c1c1e; display:flex; align-items:center; gap:8px; }
.card h2 .dot { width:8px; height:8px; border-radius:50%; background:var(--primary); }

.summary-card { background: linear-gradient(135deg, #eaf1ff, #ffffff); }
.summary-top { display:flex; justify-content:space-between; align-items:baseline; margin-bottom:10px; }
.summary-top .label { font-size:12.5px; color:#666; }
.summary-top .value { font-size:22px; font-weight:800; color:var(--primary-dark); }
.summary-sub { font-size:12px; color:#777; margin-top:8px; text-align:right; }

label { display:block; font-size:12.5px; color:#555; margin-top:10px; font-weight:600; }
input {
width:100%; padding:11px 12px; font-size:15px; border:1.5px solid #dfe3ea;
border-radius:10px; margin-top:5px; background:#fbfbfd; transition: border-color .2s, box-shadow .2s;
}
input:focus { outline:none; border-color:var(--primary); box-shadow:0 0 0 3px rgba(26,115,232,.15); background:white; }

button {
border:none; border-radius:10px; padding:12px 16px; font-size:14.5px; font-weight:700;
cursor:pointer; margin-top:14px; transition: transform .12s ease, box-shadow .2s ease, opacity .2s;
}
button:active { transform: scale(.97); }
.btn-primary { background: linear-gradient(135deg, var(--primary), var(--primary-dark)); color:white; width:100%; box-shadow:0 4px 10px rgba(26,115,232,.35); }
.btn-primary:hover { box-shadow:0 6px 16px rgba(26,115,232,.45); }
.btn-danger { background:var(--danger-bg); color:var(--danger); padding:7px 12px; font-size:12px; border:1px solid #f6c9c9; }
.btn-danger:hover { background:#fadcdc; }

.progress-track { background:#e7e9ee; border-radius:999px; height:11px; overflow:hidden; margin-top:8px; }
.progress-fill { height:100%; border-radius:999px; transition: width .6s cubic-bezier(.4,0,.2,1); }
.fill-success { background: linear-gradient(90deg,#22c55e,#16a34a); }
.fill-warning { background: linear-gradient(90deg,#fbbf24,#d97706); }
.fill-danger { background: linear-gradient(90deg,#f87171,#dc2626); }
.fill-info { background: linear-gradient(90deg,#93c5fd,#3b82f6); }

.period-card { border:1px solid #eef0f4; }
.period-head { display:flex; justify-content:space-between; align-items:center; margin-bottom:6px; }
.period-title { font-weight:700; font-size:14px; }
.badge { font-size:11px; font-weight:700; padding:4px 10px; border-radius:999px; white-space:nowrap; }
.badge-success { background:var(--success-bg); color:var(--success); }
.badge-warning { background:var(--warning-bg); color:var(--warning); }
.badge-danger { background:var(--danger-bg); color:var(--danger); }
.badge-info { background:var(--info-bg); color:var(--info); }

.period-rows { margin-top:10px; font-size:13px; }
.row { display:flex; justify-content:space-between; align-items:center; padding:7px 0; border-bottom:1px solid #f1f2f5; }
.row:last-child { border-bottom:none; }
.row .k { color:#8a8f98; }
.row .v { font-weight:700; }
.neg { color:var(--danger); }
.pos { color:var(--success); }

.hist-row { display:flex; justify-content:space-between; align-items:center; padding:10px 4px; border-bottom:1px solid #f1f2f5; transition: background .15s; border-radius:8px; }
.hist-row:hover { background:#f7f9fc; }
.hist-row:last-child { border-bottom:none; }
.hist-date { font-weight:700; font-size:13.5px; }
.hist-amount { font-size:12.5px; color:#666; }

details { background:var(--card); border-radius:var(--radius); box-shadow:var(--shadow); margin:14px 0; padding:16px; }
details summary { cursor:pointer; font-size:14px; font-weight:700; color:var(--primary-dark); list-style:none; }
details summary::-webkit-details-marker { display:none; }
details[open] summary { margin-bottom:8px; }

.empty { font-size:13px; color:#9aa0a8; text-align:center; padding:14px 0; }
</style>
</head>
<body>
<header>
<h1>Seguimiento de Pago Wilfer</h1>
<p>Control de arriendo - pagos y atrasos</p>
<p id="syncStatus" style="margin-top:6px;font-size:11px;opacity:.85;">Conectando...</p>
</header>

<div class="wrap">

<div class="card summary-card">
<h2><span class="dot"></span>Resumen general</h2>
<div class="summary-top">
<div>
<div class="label">Pagado</div>
<div class="value" id="sumPagado">$0</div>
</div>
<div style="text-align:right">
<div class="label">Objetivo total</div>
<div class="value" id="sumObjetivo">$0</div>
</div>
</div>
<div class="progress-track"><div class="progress-fill fill-info" id="sumProgress" style="width:0%"></div></div>
<div class="summary-sub" id="sumEstado">Desface acumulado: $0</div>
</div>

<div class="card">
<h2><span class="dot"></span>Registrar pago</h2>
<label>Fecha del pago</label>
<input type="date" id="pagoFecha">
<label>Monto</label>
<input type="number" id="pagoMonto" placeholder="Ej: 500000">
<button class="btn-primary" onclick="agregarPago()">Agregar pago</button>
</div>

<div class="card">
<h2><span class="dot"></span>Resumen por periodo</h2>
<div id="tablaPeriodos"></div>
</div>

<div class="card">
<h2><span class="dot"></span>Historial de pagos</h2>
<div id="listaPagos"></div>
</div>

<details>
<summary>Configuracion</summary>
<label>Fecha de inicio del primer periodo</label>
<input type="date" id="cfgInicio">
<label>Pago objetivo por periodo</label>
<input type="number" id="cfgObjetivo">
<label>Numero de periodos (meses)</label>
<input type="number" id="cfgNumPeriodos" min="1">
<button class="btn-primary" onclick="guardarConfig()">Guardar configuracion</button>
</details>

</div>

<script src="https://www.gstatic.com/firebasejs/10.12.4/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.4/firebase-firestore-compat.js"></script>
<script>
const KEY = 'seguimientoPagoWilfer_v1';
function cargar(){
const data = JSON.parse(localStorage.getItem(KEY) || 'null');
return data || { config:{inicio:'2026-07-21', objetivo:2508000, numPeriodos:5}, pagos:[] };
}
function guardar(data){
localStorage.setItem(KEY, JSON.stringify(data));
sincronizarNube(data);
}
let estado = cargar();

const firebaseConfig = {
apiKey: "AIzaSyBX-h3sfMP7RUdaIwPZmR69EAquKpEvcTs",
authDomain: "seguimiento-pago-wilfer.firebaseapp.com",
projectId: "seguimiento-pago-wilfer",
storageBucket: "seguimiento-pago-wilfer.firebasestorage.app",
messagingSenderId: "975439519813",
appId: "1:975439519813:web:81c04103f8199e76d7032c"
};
let db = null;
try {
firebase.initializeApp(firebaseConfig);
db = firebase.firestore();
} catch(e){ console.warn('Firebase no disponible', e); }

function setSyncStatus(txt){
const el = document.getElementById('syncStatus');
if(el) el.textContent = txt;
}

function sincronizarNube(data){
if(!db) return;
db.collection('wilferPagos').doc('principal').set(data).then(function(){
setSyncStatus('Sincronizado en la nube');
}).catch(function(e){
setSyncStatus('Sin conexion, guardado solo en este dispositivo');
console.warn('No se pudo sincronizar', e);
});
}

function iniciarSyncNube(){
if(!db){ setSyncStatus('Nube no disponible'); return; }
db.collection('wilferPagos').doc('principal').onSnapshot(function(doc){
if(doc.exists){
estado = doc.data();
localStorage.setItem(KEY, JSON.stringify(estado));
render();
setSyncStatus('Sincronizado en la nube');
} else {
db.collection('wilferPagos').doc('principal').set(estado);
}
}, function(err){
setSyncStatus('Sin conexion a la nube (usando datos locales)');
console.warn('Error de sincronizacion', err);
});
}

function money(val){
const neg = val<0;
const v = Math.round(Math.abs(val)).toLocaleString('es-CO');
return (neg? '-$ ' : '$ ') + v;
}
function addMonths(date, n){
const d = new Date(date);
d.setMonth(d.getMonth()+n);
return d;
}
function generarPeriodos(){
const base = new Date(estado.config.inicio + 'T00:00:00');
const periodos = [];
for(let i=0;i<estado.config.numPeriodos;i++){
periodos.push({ inicio: addMonths(base,i), fin: addMonths(base,i+1), objetivo: estado.config.objetivo });
}
return periodos;
}
function calcular(){
const periodos = generarPeriodos();
const hoy = new Date();
const pagosOrdenados = estado.pagos.slice().sort(function(a,b){ return a.fecha.localeCompare(b.fecha); });
let pool = pagosOrdenados.reduce(function(acc,p){ return acc+Number(p.monto); }, 0);
let pagadoAc = 0, objetivoAc = 0;
periodos.forEach(function(per){
const cubierto = Math.max(0, Math.min(pool, per.objetivo));
pool -= cubierto;
per.pagado = cubierto;
per.pendiente = per.objetivo - cubierto;
per.desface = cubierto - per.objetivo;
pagadoAc += cubierto;
objetivoAc += per.objetivo;
per.desfaceAc = pagadoAc - objetivoAc;
if(cubierto >= per.objetivo){
per.status = 'success'; per.label = 'Pagado';
} else if(per.fin < hoy){
per.status = 'danger'; per.label = cubierto>0 ? 'Atrasado (parcial)' : 'Atrasado';
} else if(per.inicio <= hoy){
per.status = cubierto>0 ? 'warning' : 'info';
per.label = cubierto>0 ? 'Parcial' : 'En curso';
} else {
per.status = 'info'; per.label = cubierto>0 ? 'Adelantado' : 'Proximo';
}
per.pct = Math.max(0, Math.min(100, Math.round(cubierto/per.objetivo*100)));
});
return { periodos: periodos, sobrante: pool };
}
function fmtFecha(d){
return d.toLocaleDateString('es-CO', { day:'2-digit', month:'short', year:'2-digit' });
}
function fillClass(status){
if(status === 'success') return 'fill-success';
if(status === 'danger') return 'fill-danger';
if(status === 'warning') return 'fill-warning';
return 'fill-info';
}

function render(){
document.getElementById('cfgInicio').value = estado.config.inicio;
document.getElementById('cfgObjetivo').value = estado.config.objetivo;
document.getElementById('cfgNumPeriodos').value = estado.config.numPeriodos;

const resultado = calcular();
const periodos = resultado.periodos;
const sobrante = resultado.sobrante;
let totalPagado = 0, totalObjetivo = 0;
let html = '';
periodos.forEach(function(per){
totalPagado += per.pagado;
totalObjetivo += per.objetivo;
html += '<div class="period-card card" style="margin:10px 0; padding:14px;">'
+ '<div class="period-head">'
+ '<div class="period-title">' + fmtFecha(per.inicio) + ' - ' + fmtFecha(per.fin) + '</div>'
+ '<span class="badge badge-' + per.status + '">' + per.label + '</span>'
+ '</div>'
+ '<div class="progress-track"><div class="progress-fill ' + fillClass(per.status) + '" style="width:' + per.pct + '%"></div></div>'
+ '<div class="period-rows">'
+ '<div class="row"><span class="k">Pagado</span><span class="v">' + money(per.pagado) + '</span></div>'
+ '<div class="row"><span class="k">Objetivo</span><span class="v">' + money(per.objetivo) + '</span></div>'
+ '<div class="row"><span class="k">' + (per.pendiente>=0?'Pendiente':'Excedente') + '</span><span class="v ' + (per.pendiente>=0?'neg':'pos') + '">' + money(Math.abs(per.pendiente)) + '</span></div>'
+ '<div class="row"><span class="k">Desface acumulado</span><span class="v ' + (per.desfaceAc<0?'neg':'pos') + '">' + money(per.desfaceAc) + '</span></div>'
+ '</div>'
+ '</div>';
});
document.getElementById('tablaPeriodos').innerHTML = html || '<div class="empty">Configura los periodos abajo</div>';

const totalDesface = totalPagado - totalObjetivo;
document.getElementById('sumPagado').textContent = money(totalPagado);
document.getElementById('sumObjetivo').textContent = money(totalObjetivo);
const pct = totalObjetivo ? Math.max(0, Math.min(100, Math.round(totalPagado/totalObjetivo*100))) : 0;
const sumFill = document.getElementById('sumProgress');
sumFill.style.width = pct + '%';
sumFill.className = 'progress-fill ' + (totalDesface>=0 ? 'fill-success' : (pct>=50?'fill-warning':'fill-danger'));
let estadoTxt = 'Desface acumulado: ' + money(totalDesface);
if(sobrante > 0) estadoTxt += ' - Saldo a favor sin asignar: ' + money(sobrante);
document.getElementById('sumEstado').innerHTML = estadoTxt;

let listaHtml = '';
estado.pagos.slice().sort(function(a,b){ return b.fecha.localeCompare(a.fecha); }).forEach(function(p){
listaHtml += '<div class="hist-row"><div><div class="hist-date">' + p.fecha + '</div><div class="hist-amount">' + money(Number(p.monto)) + '</div></div><button class="btn-danger" onclick="borrarPago(&apos;' + p.id + '&apos;)">Eliminar</button></div>';
});
document.getElementById('listaPagos').innerHTML = listaHtml || '<div class="empty">Sin pagos registrados</div>';
}

function agregarPago(){
const fecha = document.getElementById('pagoFecha').value;
const monto = document.getElementById('pagoMonto').value;
if(!fecha || !monto){ alert('Completa fecha y monto'); return; }
estado.pagos.push({ id: Date.now().toString(), fecha: fecha, monto: monto });
guardar(estado);
document.getElementById('pagoMonto').value = '';
render();
}
function borrarPago(id){
estado.pagos = estado.pagos.filter(function(p){ return p.id !== id; });
guardar(estado);
render();
}
function guardarConfig(){
estado.config.inicio = document.getElementById('cfgInicio').value;
estado.config.objetivo = Number(document.getElementById('cfgObjetivo').value);
estado.config.numPeriodos = Number(document.getElementById('cfgNumPeriodos').value);
guardar(estado);
render();
}
render();
iniciarSyncNube();
if('serviceWorker' in navigator){
window.addEventListener('load', function(){ navigator.serviceWorker.register('sw.js'); });
}
</script>
</body>
</html>
